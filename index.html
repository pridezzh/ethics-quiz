<html lang="zh-CN">
<head>

<style>
:root{
  --bg:#f7f8f7;
  --panel:#ffffff;
  --text:#16181d;
  --text-2:#4b5563;
  --muted:#8b93a1;
  --line:#e4e7ec;
  --line-soft:#eef0f3;
  --accent:#0f766e;
  --accent-soft:#e6f4f1;
  --ok:#0f8a5f;
  --ok-soft:#e9f8f1;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -16px rgba(16,24,40,.18);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014;
    --panel:#16191f;
    --text:#e9ecf1;
    --text-2:#b3bac6;
    --muted:#7d8797;
    --line:#252a33;
    --line-soft:#1d222a;
    --accent:#3ddbc4;
    --accent-soft:#132a29;
    --ok:#4ade80;
    --ok-soft:#12251b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -20px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 96px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
header.stuck{border-bottom-color:var(--line)}
.head-in{max-width:860px;margin:0 auto;padding:18px 20px 12px}
.title-row{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
h1{font-size:19px;font-weight:650;letter-spacing:.2px;margin:0}
.sub{font-size:12.5px;color:var(--muted);letter-spacing:.2px}
.search-box{position:relative;margin-top:12px}
.search-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
#q{
  width:100%;height:52px;padding:0 92px 0 44px;
  font-size:16px;font-family:inherit;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);outline:none;transition:border-color .18s, box-shadow .18s;
}
#q::placeholder{color:var(--muted)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft),var(--shadow)}
#q:not(:placeholder-shown) ~ .kbd-hint{opacity:0;pointer-events:none}
.kbd-hint{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
}
kbd{
  font-family:inherit;font-size:11px;line-height:1;padding:4px 6px;border-radius:5px;
  border:1px solid var(--line);background:var(--bg);color:var(--text-2);
}
#clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--muted);
  cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;
}
#clear:hover{background:var(--line-soft);color:var(--text)}

/* ---------- filters ---------- */
.filters{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.selwrap{position:relative;display:inline-flex;align-items:center}
.selwrap svg{position:absolute;right:8px;width:14px;height:14px;color:var(--muted);pointer-events:none}
#chSel{
  appearance:none;-webkit-appearance:none;font-family:inherit;font-size:12.5px;color:var(--text-2);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:6px 26px 6px 10px;max-width:210px;min-width:0;cursor:pointer;outline:none;transition:.15s;
  text-overflow:ellipsis;
}
#chSel:hover{border-color:var(--muted);color:var(--text)}
#chSel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (prefers-color-scheme: dark){.chip[aria-pressed="true"]{color:#08110f}}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row2 > div{min-width:0}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;font-family:inherit;font-size:12.5px;color:var(--text-2);
  padding:5px 11px;border-radius:7px;cursor:pointer;transition:.15s;
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--text);font-weight:650}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:34px;height:19px;border-radius:999px;background:var(--line);position:relative;transition:.18s;flex:0 0 auto}
.track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(15px)}

/* ---------- list ---------- */
main{padding-top:16px;display:flex;flex-direction:column;gap:11px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px 15px;box-shadow:var(--shadow);
  animation:in .28s cubic-bezier(.2,.7,.3,1) both;
  scroll-margin-top:190px;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:11px;line-height:1.5;padding:2px 7px;border-radius:6px;letter-spacing:.3px;white-space:nowrap}
.b-num{background:var(--accent-soft);color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums}
.b-ch{background:var(--line-soft);color:var(--text-2)}
.b-type{background:transparent;border:1px solid var(--line);color:var(--muted)}
.copy{
  margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);
  font-family:inherit;font-size:11.5px;padding:3px 9px;border-radius:6px;cursor:pointer;transition:.15s;
}
.copy:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.stem{font-size:15.5px;font-weight:550;line-height:1.72;letter-spacing:.1px;word-break:break-word}
.opts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.opts li{
  display:flex;gap:9px;align-items:flex-start;font-size:14.2px;color:var(--text-2);line-height:1.62;
  padding:5px 9px;border-radius:8px;border:1px solid transparent;
}
.opts .k{
  flex:0 0 auto;font-size:12px;font-weight:650;color:var(--muted);
  min-width:15px;text-align:center;padding-top:2px;
}
.opts li.right{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,transparent);color:var(--text)}
.opts li.right .k{color:var(--ok)}
.tick{margin-left:auto;color:var(--ok);font-size:12px;font-weight:700;flex:0 0 auto;padding-top:1px}
.ans{
  margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);
  display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap;
}
.ans .lab{color:var(--muted);font-size:12px;letter-spacing:.4px}
.ans .val{color:var(--ok);font-weight:700;letter-spacing:1.2px;font-size:14px}
.ans .txt{color:var(--text-2);font-size:13px;border-left:1px solid var(--line);padding-left:10px;line-height:1.5}
.hidden-note{display:none;color:var(--muted);font-size:12.5px;font-style:normal}
.card.masked .opts li.right{background:transparent;border-color:transparent;color:var(--text-2)}
.card.masked .opts li.right .k{color:var(--muted)}
.card.masked .tick{display:none}
.card.masked .ans{display:none}
.card.masked .hidden-note{display:inline}
.card.masked{cursor:pointer}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px;font-weight:600}
@media (prefers-color-scheme: dark){mark{background:color-mix(in srgb,var(--accent) 30%,transparent)}}

/* ---------- states ---------- */
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--text-2);font-weight:600}
.empty p{margin:0;font-size:13px;line-height:1.8}
.more{text-align:center;padding:18px 0 4px;color:var(--muted);font-size:12.5px}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:26px 0 0;line-height:1.9}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:var(--text);color:var(--bg);font-size:12.5px;padding:8px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .wrap,.head-in{padding-left:14px;padding-right:14px}
  h1{font-size:17px}
  .kbd-hint{display:none}
  #q{padding-right:44px;font-size:15.5px}
  .card{padding:14px 14px 13px}
  .stem{font-size:15px}
  .opts li{font-size:13.6px}
}
</style>

"A","text":"实际没有进行实验,得出研究结论"},{"key":"B","text":"故意取舍数据原始数据,以符合自己期望的研究结论"},{"key":"C","text":"侵犯或损害他人著作权,故意省略参考他人出版物"},{"key":"D","text":"伪造履历、论文等"}],"ans":"C","ansRaw":"C"},{"id":66,"ch":4,"chTitle":"第04讲 工程前端设计规范","type":"single","q":"关于数据与研究的真实性,以下哪一条表述是正确的()","opts":[{"key":"A","text":"由于数据失真会影响到研究的真实性,在记录数据时应删除那些误差较大的数据"},{"key":"B","text":"由于已经公开发表的成果一般是通过同行评议后发表的,一旦发现捏造篡改数据的情况,应该由科学共同体共同承担相应的责任"},{"key":"C","text":"捏造和篡改数据的研究人员,应该受到包括撤销论文等在内的相应的处罚"},{"key":"D","text":"数据和研究的真实性是相对而言的,只要不被发现,捏造和篡改数据有利于多出成果"}],"ans":"C","ansRaw":"C"},{"id":67,"ch":4,"chTitle":"第04讲 工程前端设计规范","type":"single","q":"数据记录应该力求完整,但以下哪条要求一般是不必要的()","opts":[{"key":"A","text":"准确记录数据的原始结果"},{"key":"B","text":"记录数据的采集日期"},{"key":"C","text":"记录数据的收集顺序"},{"key":"D","text":"记录采集数据时的心情"}],"ans":"D","ansRaw":"D"},{"id":68,"ch":4,"chTitle":"第04讲 工程前端设计规范","type":"single","q":"以下行为明显属于篡改的是()","opts":[{"key":"A","text":"在研究中有意对原始调查数据或实验数据、图像或图表进行改动、挑选使用或随意增删数据,使其原始性和完整性不能得到准确反映"},{"key":"B","text":"利用他人已发表成果中的创意、研究方法、数据、图像、结果或文字表述而未通过恰当的引注与说明对他人的奉献予以相应的承认"},{"key":"C","text":"在申报课题、进行研究和报告成果等科研的各个环节,捏造实验或调查过程,编造数据、图像、 资料、文献或研究结果,并将其报告或发表"},{"key":"D","text":"未经许可使用他人未发表的成果或重要学术观点"}],"ans":"A","ansRaw":"A"},{"id":69,"ch":4,"chTitle":"第04讲 工程前端设计规范","type":"single","q":"国家标准和行业标准⼜分为强制性标准和()","opts":[{"key":"A","text":"普通标准"},{"key":"B","text":"推荐性标准"},{"key":"C","text":"最高标准"},{"key":"D","text":"企业标准"}],"ans":"B","ansRaw":"B"},{"id":70,"ch":4,"chTitle":"第04讲 工程前端设计规范","type":"single","q":"在我国标准体系中,从标准水平上看,()应该占据绝对优势","opts":[{"key":"A","text":"国家标准"},{"key":"B","text":"行业标准"},{"key":"C","text":"地方标准"},{"key":"D","text":"企业标准"}],"ans":"D","ansRaw":"D"},{"id":71,"ch":4,"chTitle":"第04讲 工程前端设计规范","type":"multi","q":"下列各项中,常见的科研不端行为有哪些?()","opts":[{"key":"A","text":"伪造"},{"key":"B","text":"篡改"},{"key":"C","text":"抄袭"},{"key":"D","text":"引用"}],"ans":"ABC","ansRaw":"A, B, C"},{"id":72,"ch":4,"chTitle":"第04讲 工程前端设计规范","type":"multi","q":"下列各项中,属于伪造和篡改的常见表现形式的是( )","opts":[{"key":"A","text":"伪造试验样品、论文材料与方法" text":"正确"},{"key":"F","text":"错误"}],"ans":"F","ansRaw":"❌"},{"id":300,"ch":15,"chTitle":"第15讲 集成电路领域工程伦理","type":"judge","q":"当工程风险发生时,往往不能将全部责任归结于某一个人,而需要工程共同体承担。()","opts":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"ans":"T","ansRaw":"✔"},{"id":301,"ch":15,"chTitle":"第15讲 集成电路领域工程伦理","type":"judge","q":"单纯地以经营销售为目的而复制他人受保护的布图设计而生产芯片,应视为侵权行为。()","opts":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"ans":"T","ansRaw":"✔"},{"id":302,"ch":15,"chTitle":"第15讲 集成电路领域工程伦理","type":"judge","q":"对工程师的评价标准是工程师是否把工作做好。()","opts":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"ans":"F","ansRaw":"❌"},{"id":303,"ch":15,"chTitle":"第15讲 集成电路领域工程伦理","type":"judge","q":"集成电路工程造成环境污染问题的主要原因是生产原料和生产工艺的问题。()","opts":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"ans":"T","ansRaw":"✔"}]};
const QS = DATA.questions;
const CHS = DATA.chapters;

const $ = (s) => document.querySelector(s);
const listEl = $('#list'), qEl = $('#q'), countEl = $('#count'), moreEl = $('#more');

const state = { q: '', ch: 0, type: 'all', mask: false, shown: 20, active: -1, hits: [] };
const TYPE_LABEL = { single: '单选', multi: '多选', judge: '判断' };

/* ---------- 索引 ---------- */
const index = QS.map(q => ({
  q,
  stem: q.q.toLowerCase(),
  opts: q.opts.map(o => o.text.toLowerCase()),
  meta: (q.chTitle + ' ' + q.ans + ' ' + q.ansRaw + ' ' + TYPE_LABEL[q.type]).toLowerCase()
}));

function tokenize(s) {
  return s.trim().toLowerCase().split(/[\s\u3000]+/).filter(Boolean);
}

/* ---------- 检索 ---------- */
function search() {
  const toks = tokenize(state.q);
  const qraw = state.q.trim().toLowerCase();

  let res = [];
  for (let i = 0; i < index.length; i++) {
    const it = index[i];
    if (state.ch && it.q.ch !== state.ch) continue;
    if (state.type !== 'all' && it.q.type !== state.type) continue;

    if (!toks.length) { res.push({ q: it.q, score: 0 }); continue; }

    let score = 0, ok = true;
    for (const t of toks) {
      let hit = false;
      if (it.stem.includes(t)) { score += 6; hit = true; }
      // 答案精确查询（如输入 "C"、"ABD"）
      if (/^[a-h]{1,4}$|^[tf]$/i.test(t) && it.q.ans.toLowerCase() === t) { score += 12; hit = true; }
      if (it.opts.some(o => o.includes(t))) { score += 2; hit = true; }
      if (it.meta.includes(t)) { score += 1; hit = true; }
      if (!hit) { ok = false; break; }
    }
    if (!ok) continue;
    // 完整短语命中题干，加权
    if (qraw.length > 1 && it.stem.includes(qraw)) score += 15;
    res.push({ q: it.q, score });
  }

  if (toks.length) res.sort((a, b) => b.score - a.score || a.q.id - b.q.id);
  state.hits = res;
  state.active = -1;
  render(true);
}

/* ---------- 高亮 ---------- */
function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function hl(s) {
  let out = esc(s);
  const toks = tokenize(state.q).filter(t => t.length > 0).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!toks.length) return out;
  const re = new RegExp('(' + toks.join('|') + ')', 'gi');
  return out.replace(re, '<mark>$1</mark>');
}

/* ---------- 渲染 ---------- */
function cardHTML(q, idx) {
  const isJudge = q.type === 'judge';
  const ansSet = new Set(q.ans.split(''));
  let opts = '';
  if (!isJudge) {
    opts = '<ul class="opts">' + q.opts.map(o => {
      const right = ansSet.has(o.key);
      return '<li class="' + (right ? 'right' : '') + '"><span class="k">' + o.key + '</span><span>' + hl(o.text) + '</span>' +
        (right ? '<span class="tick">✓</span>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  let val = '', detail = '';
  if (isJudge) {
    val = q.ans === 'T' ? '正确' : (q.ans === 'F' ? '错误' : q.ansRaw);
  } else {
    val = q.ans;
    const picked = q.opts.filter(o => ansSet.has(o.key)).map(o => o.text.replace(/[。，,.\s]+$/, ''));
    if (picked.length && picked.join('').length <= 26) detail = picked.join(' / ');
  }

  return '<article class="card' + (state.mask ? ' masked' : '') + '" data-i="' + idx + '" id="c' + q.id + '">' +
    '<div class="meta">' +
      '<span class="badge b-num">' + String(q.id).padStart(3, '0') + '</span>' +
      '<span class="badge b-ch">' + esc(q.chTitle) + '</span>' +
      '<span class="badge b-type">' + TYPE_LABEL[q.type] + '</span>' +
      '<span class="hidden-note">点击查看答案</span>' +
      '<button class="copy" data-copy="' + idx + '">复制</button>' +
    '</div>' +
    '<div class="stem">' + hl(q.q) + '</div>' +
    opts +
    '<div class="ans"><span class="lab">答案</span><span class="val">' + esc(val) + '</span>' +
    (detail ? '<span class="txt">' + esc(detail) + '</span>' : '') + '</div>' +
  '</article>';
}

function render(reset) {
  if (reset) state.shown = 20;
  const slice = state.hits.slice(0, state.shown);
  if (!state.hits.length) {
    listEl.innerHTML = '<div class="empty"><div class="big">⌕</div><h3>没有匹配的题目</h3>' +
      '<p>试试更短的关键词，或换个说法<br>例如「安全」「知情同意」「利益冲突」「工程师」</p></div>';
    moreEl.textContent = '';
  } else {
    listEl.innerHTML = slice.map((h, i) => cardHTML(h.q, i)).join('');
    moreEl.textContent = state.hits.length > state.shown
      ? '已显示 ' + state.shown + ' / ' + state.hits.length + ' 题，继续向下滚动加载更多'
      : '已到末尾 · 共 ' + state.hits.length + ' 题';
  }
  countEl.innerHTML = '<b>' + state.hits.length + '</b> 道题';
  syncURL();
  document.querySelectorAll('.card').forEach(el => el.style.animationDelay = Math.min(parseInt(el.dataset.i) || 0, 12) * 12 + 'ms');
}

/* ---------- URL 同步 ---------- */
function syncURL() {
  try {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    if (state.ch) p.set('ch', state.ch);
    if (state.type !== 'all') p.set('t', state.type);
    const s = p.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
  } catch (e) { /* file:// 下可能不支持，忽略 */ }
}

/* ---------- 交互 ---------- */
let timer;
qEl.addEventListener('input', () => {
  clearTimeout(timer);
  $('#clear').style.display = qEl.value ? 'flex' : 'none';
  timer = setTimeout(() => { state.q = qEl.value; search(); }, 70);
});

$('#clear').addEventListener('click', () => {
  qEl.value = ''; state.q = ''; $('#clear').style.display = 'none'; qEl.focus(); search();
});

qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { qEl.value = ''; state.q = ''; $('#clear').style.display = 'none'; search(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  if (e.key === 'Enter') { e.preventDefault(); openFirst(); }
});

function move(d) {
  const cards = document.querySelectorAll('.card');
  if (!cards.length) return;
  state.active = Math.max(0, Math.min(cards.length - 1, state.active + d));
  cards.forEach(c => c.classList.remove('active'));
  const el = cards[state.active];
  el.classList.add('active');
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function openFirst() {
  const cards = document.querySelectorAll('.card');
  const el = cards[Math.max(0, state.active)];
  if (!el) return;
  if (state.mask) el.classList.remove('masked');
}

listEl.addEventListener('click', e => {
  const btn = e.target.closest('.copy');
  if (btn) {
    const q = state.hits[+btn.dataset.copy].q;
    const opts = q.opts.map(o => o.key + '. ' + o.text).join('\n');
    const ans = q.type === 'judge' ? (q.ans === 'T' ? '正确' : '错误') : q.ans;
    const txt = q.q + '\n' + opts + '\n答案：' + ans;
    navigator.clipboard.writeText(txt).then(() => toast('已复制'), () => toast('复制失败'));
    return;
  }
  const card = e.target.closest('.card');
  if (card && card.classList.contains('masked')) card.classList.remove('masked');
});

/* 章节下拉 */
const chSel = $('#chSel');
chSel.innerHTML = '<option value="0">全部章节 · ' + QS.length + ' 题</option>' +
  CHS.map(c => {
    const n = QS.filter(q => q.ch === c.no).length;
    return '<option value="' + c.no + '">' + esc(c.title) + ' · ' + n + ' 题</option>';
  }).join('');
chSel.addEventListener('change', () => { state.ch = +chSel.value; search(); });

/* 题型 */
$('#types').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  $('#types').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  state.type = b.dataset.t;
  search();
});

/* 自测模式 */
$('#mask').addEventListener('change', e => {
  state.mask = e.target.checked;
  try { localStorage.setItem('ethicsQuizMask', state.mask ? '1' : '0'); } catch (err) {}
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('masked', state.mask));
});

/* 无限滚动 */
const io = new IntersectionObserver(es => {
  if (es[0].isIntersecting && state.hits.length > state.shown) {
    state.shown += 30;
    render(false);
  }
}, { rootMargin: '600px' });
io.observe(moreEl);

/* 快捷键 */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
  if (e.key === 'Escape' && document.activeElement !== qEl) { qEl.focus(); }
});

/* 顶栏阴影 */
const hd = $('#hd');
addEventListener('scroll', () => hd.classList.toggle('stuck', scrollY > 4), { passive: true });

/* toast */
let tt;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1400);
}

/* 初始化 */
$('#sub').textContent = QS.length + ' 题 · ' + CHS.length + ' 讲';
$('#f-total').textContent = QS.length;
$('#f-ch').textContent = CHS.length;

/* 支持分享链接：?q=关键词&ch=章节&t=题型 */
(function () {
  try {
    if (localStorage.getItem('ethicsQuizMask') === '1') {
      state.mask = true;
      $('#mask').checked = true;
    }
  } catch (err) {}
  const p = new URLSearchParams(location.search);
  const qv = p.get('q'), cv = p.get('ch'), tv = p.get('t');
  if (qv) { qEl.value = qv; state.q = qv; $('#clear').style.display = 'flex'; }
  if (cv && CHS.some(c => String(c.no) === cv)) { state.ch = +cv; chSel.value = cv; }
  if (tv && ['single', 'multi', 'judge'].includes(tv)) {
    state.type = tv;
    $('#types').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t) === tv));
  }
})();

search();
</script>
</body>
</html>
